[workspace]
name = "sjsrey-github-io"
version = "0.1.0"
description = "Quarto-based personal website for Sergio J. Rey"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
quarto = ">=1.5"

[tasks]
render = { cmd = "quarto render", description = "Render the site into docs/" }
preview = { cmd = "quarto preview", description = "Serve a live-reloading local preview" }
publish = { cmd = "quarto publish gh-pages", description = "Render and push the site to the gh-pages branch (GitHub Pages source)" }
